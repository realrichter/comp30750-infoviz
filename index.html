<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ireland's Export Rush</title>
  <script src="https://cdn.jsdelivr.net/npm/vega@5.30.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@5.21.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@6.26.0"></script>
  <style>
    body { font-family: sans-serif; margin: 24px; }
    #controls { margin: 0 0 12px 5px; font-size: 13px; }
  </style>
</head>
<body>
  <div id="controls"></div>
  <div id="vis"></div>
  <script>
    // The spec loads data/monthly_trade.csv, so open this page through a web server, not as a local file.
    vegaEmbed("#vis", "dashboard.vl.json")
      .catch(err => {
        document.getElementById("vis").innerHTML =
          "<p>Could not load the dashboard (" + err + "). Open it via a web server: run <code>python -m http.server</code> in this folder and go to http://localhost:8000.</p>";
      });
  </script>
</body>
</html>
